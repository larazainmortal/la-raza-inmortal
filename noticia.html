
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Raza Inmortal | Noticia</title>

<style>
:root {
  --red: #d71920;
  --dark: #111;
  --ink: #191919;
  --muted: #6b7280;
  --paper: #f4f4f4;
  --white: #fff;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: var(--paper);
  color: var(--ink);
}

a { color: inherit; text-decoration: none; }

.topline {
  height: 7px;
  background: linear-gradient(90deg, var(--red) 0 50%, #111 50%);
}

header {
  background: #111;
  color: white;
}

.wrap {
  width: min(1120px, 92%);
  margin: auto;
}

.brandbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 22px 0;
}

.brand {
  display: flex;
  align-items: center;
  gap: 13px;
}

.crest {
  width: 54px;
  height: 62px;
  background: linear-gradient(90deg, var(--red) 0 50%, #111 50%);
  border: 3px solid white;
  clip-path: polygon(0 0,100% 0,100% 72%,50% 100%,0 72%);
  display: grid;
  place-items: center;
  font-weight: 900;
  font-size: 18px;
}

.brand h1 {
  font-size: clamp(22px,4vw,34px);
  line-height: .95;
  margin: 0;
  font-weight: 900;
}

.brand h1 span { color: var(--red); }

.brand small {
  display: block;
  color: #bbb;
  letter-spacing: 2px;
  font-size: 10px;
  margin-top: 7px;
}

.tagline {
  font-size: 12px;
  color: #ccc;
  text-align: right;
  text-transform: uppercase;
  letter-spacing: 1.5px;
}

nav {
  border-top: 1px solid #333;
  background: #191919;
}

nav .wrap {
  display: flex;
  overflow-x: auto;
}

nav a {
  padding: 15px 17px;
  color: #eee;
  font-size: 12px;
  font-weight: 800;
  text-transform: uppercase;
  white-space: nowrap;
}

nav a:hover {
  background: #242424;
  border-bottom: 3px solid var(--red);
}

main {
  padding: 38px 0 55px;
}

.section-head {
  border-bottom: 3px solid #191919;
  margin-bottom: 25px;
}

.section-head h2 {
  font-size: 22px;
  text-transform: uppercase;
  margin: 0 0 10px;
}

.section-head h2:before {
  content: "";
  display: inline-block;
  width: 7px;
  height: 20px;
  background: var(--red);
  margin-right: 10px;
  vertical-align: -3px;
}

.noticia {
  background: white;
  box-shadow: 0 3px 14px rgba(0,0,0,.08);
  max-width: 850px;
  margin: auto;
}

.noticia img {
  width: 100%;
  max-height: 470px;
  object-fit: cover;
  display: block;
}

.noticia-body {
  padding: 30px;
}

.category {
  color: var(--red);
  font-size: 12px;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.noticia h2 {
  font-size: clamp(28px,5vw,42px);
  line-height: 1.12;
  margin: 15px 0;
  color: #191919;
}

.meta {
  color: #999;
  font-size: 11px;
  text-transform: uppercase;
  font-weight: 700;
  margin-bottom: 25px;
}

.cuerpo {
  font-size: 17px;
  line-height: 1.8;
  color: #444;
  white-space: pre-wrap;
}

.volver {
  display: inline-block;
  background: var(--red);
  color: white;
  padding: 13px 20px;
  font-size: 12px;
  font-weight: 900;
  text-transform: uppercase;
  margin-top: 30px;
}

footer {
  background: #111;
  color: #aaa;
  padding: 28px 0;
  font-size: 11px;
}

footer strong { color: white; }

footer .wrap {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
}

@media(max-width:760px) {
  .tagline { display: none; }
  .noticia-body { padding: 20px; }
  .noticia img { max-height: 280px; }
  .cuerpo { font-size: 16px; }
}
</style>
</head>

<body>

<div class="topline"></div>

<header>
  <div class="wrap brandbar">
    <div class="brand">
      <div class="crest">C</div>
      <div>
        <h1>LA RAZA <span>INMORTAL</span></h1>
        <small>EL SENTIMIENTO SABALERO</small>
      </div>
    </div>
    <div class="tagline">Toda la actualidad de Colón</div>
  </div>

  <nav>
    <div class="wrap">
      <a href="index.html">Inicio</a>
      <a href="index.html#actualidad">Actualidad sabalera</a>
      <a href="index.html#futbol">Fútbol profesional</a>
      <a href="index.html#historia">Historia</a>
    </div>
  </nav>
</header>

<main class="wrap">

  <div class="section-head">
    <h2>Actualidad sabalera</h2>
  </div>

  <article class="noticia" id="contenido">
    <div class="noticia-body">Cargando noticia...</div>
  </article>

  <a class="volver" href="index.html#actualidad">← Volver a las noticias</a>

</main>

<footer>
  <div class="wrap">
    <strong>LA RAZA INMORTAL</strong>
    <span>El sentimiento sabalero</span>
  </div>
</footer>

<script>
const noticia = JSON.parse(
  localStorage.getItem("noticiaSeleccionada") || "null"
);

const contenido = document.getElementById("contenido");

if (noticia) {
  contenido.innerHTML = `
    <img id="foto" alt="">
    <div class="noticia-body">
      <span class="category" id="categoria"></span>
      <h2 id="titulo"></h2>
      <div class="meta" id="fecha"></div>
      <div class="cuerpo" id="cuerpo"></div>
    </div>
  `;

  document.getElementById("foto").src = noticia.imagen || "";
  document.getElementById("foto").alt = noticia.titulo || "";
  document.getElementById("categoria").textContent = noticia.categoria || "";
  document.getElementById("titulo").textContent = noticia.titulo || "";
  document.getElementById("fecha").textContent = noticia.fecha || "";
  document.getElementById("cuerpo").textContent = noticia.cuerpo || "";
} else {
  contenido.querySelector(".noticia-body").textContent =
    "No se encontró la noticia. Volvé a la página principal y seleccioná una publicación.";
}
</script>

</body>
</html>
